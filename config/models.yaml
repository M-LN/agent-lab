# Model registry. "enabled: false" models are skipped unless you pass --include-disabled.
defaults:
  temperature: 0.0
  max_tokens: 800
  timeout: 180
  retries: 2

concurrency:
  ollama: 1      # local GPU/CPU: keep serial so latency numbers stay comparable
  hf: 2        # bursts trip the router's quota limiter; pace the calls

backends:
  ollama: {}
  hf: {}

models:
  # ---------------------------------------------------------------- local (Ollama)
  - id: local/qwen3-8b
    label: Qwen3 8B (lokal)
    backend: ollama
    model: qwen3:8b
    tags: [local, small, reasoning]
    params:
      think: false        # otherwise the answer is buried in chain-of-thought

  - id: local/llama3.1-8b
    label: Llama 3.1 8B (lokal)
    backend: ollama
    model: llama3.1:8b
    tags: [local, small]

  - id: local/mistral-7b
    label: Mistral 7B Instruct (lokal)
    backend: ollama
    model: mistral:7b-instruct
    tags: [local, small]

  - id: local/qwen2.5-coder-7b
    label: Qwen2.5 Coder 7B (lokal)
    backend: ollama
    model: qwen2.5-coder:7b
    tags: [local, small, code]

  - id: local/qwythos-9b
    label: Qwythos 9B (lokal, HF GGUF)
    backend: ollama
    model: hf.co/empero-ai/Qwythos-9B-Claude-Mythos-5-1M-GGUF:Q4_K_M
    tags: [local, hf-gguf, reasoning]
    token_budget: 3.0   # enough for every prompt it can answer at all. Six rungs of
                        # the refusal ladder it cannot: at 6.0 it produced 18,000
                        # characters of reasoning and zero answer, so its reasoning
                        # expands to fill whatever budget it is given.

  # ------------------------------------------------- Hugging Face Inference Providers
  # Enable these once HF_TOKEN is in .env (set enabled: true, or use --include-disabled).
  - id: hf/llama-3.3-70b
    label: Llama 3.3 70B (HF)
    backend: hf
    model: meta-llama/Llama-3.3-70B-Instruct
    tags: [api, large]
    enabled: false

  - id: hf/qwen2.5-72b
    label: Qwen2.5 72B (HF)
    backend: hf
    model: Qwen/Qwen2.5-72B-Instruct
    tags: [api, large]
    enabled: false

  - id: hf/deepseek-v3
    label: DeepSeek V3 (HF)
    backend: hf
    model: deepseek-ai/DeepSeek-V3-0324
    tags: [api, large, reasoning]
    token_budget: 2.0
    enabled: false

  # Verified 2026-09-13: the router serves no Mistral models on this account,
  # and Mistral-Small-3.2-24B returns "is not a chat model".
  - id: hf/gemma-3-27b
    label: Gemma 3 27B (HF)
    backend: hf
    model: google/gemma-3-27b-it
    tags: [api, mid]
    enabled: false

  # Same weights as local/llama3.1-8b, served instead of run locally - isolates
  # quantisation and serving effects from model differences.
  - id: hf/llama-3.1-8b
    label: Llama 3.1 8B (HF)
    backend: hf
    model: meta-llama/Llama-3.1-8B-Instruct
    tags: [api, small, twin]
    enabled: false

  - id: hf/gpt-oss-120b
    label: gpt-oss 120B (HF)
    backend: hf
    model: openai/gpt-oss-120b
    tags: [api, large, reasoning]
    token_budget: 2.5
    enabled: false
