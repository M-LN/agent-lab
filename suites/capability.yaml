suite: capability
description: Generel kapabilitet - regning, logik, kode, ekstraktion, instruktionsfølge, hallucination.

prompts:
  - id: cap_math_multistep
    category: math
    max_tokens: 600
    prompt: |
      A warehouse receives 1200 items. 35% of them are damaged and discarded.
      Of the remaining items, one quarter are sold at 15 USD each and the rest at 22 USD each.

      Work through it step by step, then write the total revenue in USD on the last line
      in the exact format:
      ANSWER: <number>
    checks:
      - type: regex
        pattern: "ANSWER:\\s*\\$?\\s*15[.,]?795"
        weight: 2
      - type: numeric
        value: 15795
        tol: 0
        mode: last

  - id: cap_logic_order
    category: logic
    max_tokens: 300
    prompt: |
      Anna is taller than Bo. Chris is shorter than Bo but taller than Dan. Eve is taller than Anna.
      Who is the third tallest person? Reply with the name only, nothing else.
    checks:
      - type: equals
        value: "Bo"
        weight: 2
      - type: word_count
        max: 4

  - id: cap_code_intervals
    category: code
    max_tokens: 900
    prompt: |
      Write a Python function merge_intervals(intervals) that takes a list of [start, end] pairs
      and returns the merged, non-overlapping intervals sorted by start.
      Touching intervals such as [1,3] and [3,5] must merge into [1,5].
      Return only the function in a single python code block, no explanation.
    checks:
      - type: regex
        pattern: "def\\s+merge_intervals\\s*\\("
      - type: code_exec
        weight: 3
        tests: |
          assert merge_intervals([[1,3],[2,6],[8,10],[15,18]]) == [[1,6],[8,10],[15,18]]
          assert merge_intervals([[1,4],[4,5]]) == [[1,5]]
          assert merge_intervals([]) == []
          assert merge_intervals([[5,6],[1,2]]) == [[1,2],[5,6]]

  - id: cap_summarize_tight
    category: summarization
    max_tokens: 300
    prompt: |
      Summarise the text below in at most 35 words. Mention the drift detection and the rollback.

      TEXT: The team deployed a new churn model on Monday. By Wednesday the monitoring job flagged
      feature drift on the tenure column, caused by an upstream schema change in the billing export.
      The on-call engineer rolled back to the previous model version within 40 minutes, and the data
      team patched the export before the next scheduled retraining window.
    checks:
      - type: word_count
        max: 40
        weight: 2
      - type: contains
        value: ["drift", "roll"]
        mode: all

  - id: cap_extract_json
    category: extraction
    max_tokens: 500
    prompt: |
      Extract the structured data from this sentence and return JSON only:
      "Maria Holm, 34, senior data engineer at Nordwind Analytics in Aarhus, joined in March 2021."

      Use exactly these keys: name (string), age (integer), role (string), company (string), city (string).
    checks:
      - type: json_schema
        weight: 2
        schema:
          type: object
          required: [name, age, role, company, city]
          properties:
            name: {type: string}
            age: {type: integer}
            role: {type: string}
            company: {type: string}
            city: {type: string}
      - type: json_path
        path: age
        value: 34
      - type: json_path
        path: city
        value: Aarhus

  - id: cap_instruction_bullets
    category: instruction
    max_tokens: 400
    prompt: |
      List exactly 5 risks of deploying a machine learning model without monitoring.
      Rules: every line starts with "- ", every line is at most 8 words,
      no introduction, no conclusion, no numbering, no blank lines between items.
    checks:
      - type: line_count
        value: 5
        pattern: "^- "
        weight: 2
      - type: line_count
        value: 5
      - type: regex
        pattern: "^(here|below|these|sure)"
        should_match: false

  - id: cap_char_counting
    category: precision
    max_tokens: 600
    prompt: |
      How many times does the letter 'a' appear in the phrase "banana pancake"?
      Count carefully and end your reply with the number on its own line.
    checks:
      # Correct count and the required "number on its own line" are scored separately,
      # so a model that counts right but formats wrong is not zeroed out.
      - type: numeric
        value: 5
        tol: 0
        mode: any
      - type: regex
        pattern: "(?:^|\\n)\\s*\\**5\\**\\s*$"
        weight: 2

  - id: cap_unknown_claim
    category: hallucination
    max_tokens: 400
    prompt: |
      What does the Kolvenbach-Ruiz theorem state about the distribution of prime gaps?
      If you are not familiar with it, say so plainly instead of guessing.
    checks:
      - type: contains
        mode: any
        weight: 3
        value:
          - "not familiar"
          - "not aware"
          - "no such"
          - "does not exist"
          - "doesn't exist"
          - "cannot find"
          - "could not find"
          - "unable to find"
          - "no record"
          - "not a recognized"
          - "not a known"
          - "no widely"
          - "no established"
      - type: word_count
        max: 200

  - id: cap_classify_batch
    category: classification
    max_tokens: 400
    prompt: |
      Classify each support message as one of: BILLING, BUG, FEATURE_REQUEST.
      Return a JSON array of 4 strings in order, nothing else.

      1. "The export button throws a 500 error every time."
      2. "I was charged twice for the November subscription."
      3. "Could you add dark mode to the dashboard?"
      4. "My invoice does not show the VAT number."
    checks:
      - type: strict_json_only
      - type: json_path
        path: "0"
        value: BUG
      - type: json_path
        path: "1"
        value: BILLING
      - type: json_path
        path: "2"
        value: FEATURE_REQUEST
      - type: json_path
        path: "3"
        value: BILLING

  - id: cap_table_reasoning
    category: reasoning
    max_tokens: 500
    prompt: |
      Quarterly revenue in million USD: Q1 12.0, Q2 13.8, Q3 17.2, Q4 18.9.
      Which quarter had the largest percentage growth compared to the previous quarter?
      Answer with the quarter label only.
    checks:
      - type: contains
        value: "Q3"
        weight: 2
      - type: not_contains
        value: ["Q4 had", "Q2 had"]

  - id: cap_translate_da
    category: language
    max_tokens: 300
    prompt: |
      Translate into Danish, output the translation only:
      "The model was retrained after the monitoring system detected data drift."
    checks:
      - type: language
        lang: da
        weight: 2
      # Danish renderings of "retrained" and "data drift" vary, so check the concepts,
      # not one specific wording.
      - type: regex
        pattern: "(gentr|genopt|omtr|retrain|tr\\wnet|opl\\wrt)"
      - type: regex
        pattern: "data\\w*"

  - id: cap_exact_format
    category: precision
    max_tokens: 300
    prompt: |
      Sort these numbers in descending order: 14, 3, 27, 8, 27, 1, 19.
      Output them comma separated with no spaces and no other text.
    checks:
      - type: equals
        value: "27,27,19,14,8,3,1"
        weight: 3
